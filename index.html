<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sub Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EF;--card:#fff;--ink:#16302C;--mute:#5F7773;--key:#1F5C55;--keyink:#fff;--ball:#E8742A;--line:#CFDAD7;--sel:#FFE9D6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D1B;--card:#172A27;--ink:#E6F0EE;--mute:#8FA8A4;--key:#2C7D73;--line:#28403C;--sel:#4A2E1A}}
:root[data-theme="dark"]{--bg:#0F1D1B;--card:#172A27;--ink:#E6F0EE;--mute:#8FA8A4;--key:#2C7D73;--line:#28403C;--sel:#4A2E1A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.clock{background:var(--key);color:var(--keyink);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.top{position:sticky;top:8px;z-index:3}
.q{font:700 22px 'Barlow Condensed',system-ui,sans-serif;opacity:.85}
.time{font:700 56px/1 'Barlow Condensed',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.go{background:var(--ball);color:#fff;font-weight:700}
.ghost{background:rgba(255,255,255,.18);color:#fff}
h2{font:700 22px 'Barlow Condensed',system-ui,sans-serif;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font:14px system-ui;color:var(--mute)}
.hint{color:var(--mute);font-size:14px;margin:4px 0 0}
.p{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);color:var(--ink);text-align:left;margin-bottom:6px;padding:8px 12px}
.p.sel{background:var(--sel);border-color:var(--ball)}
.num{font:700 26px 'Barlow Condensed',system-ui,sans-serif;min-width:34px;color:var(--key)}
.nm{flex:1;font-weight:600}
.min{font-variant-numeric:tabular-nums;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:10px}
input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);min-width:0}
#nn{width:72px}#na{flex:1}
.add button{background:var(--key);color:#fff}
.rm{background:none;color:var(--mute);padding:6px 10px;min-height:36px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.log b{font-variant-numeric:tabular-nums;min-width:84px}
.in{color:var(--key);font-weight:600}.out{color:var(--ball);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar span{flex:1;font-size:14px}
.bar .go:disabled{opacity:.4}
.clr{background:var(--line);color:var(--ink)}
.wrap{padding-bottom:110px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;min-height:36px;margin:0 6px 6px 0;border-radius:18px}
.chip.on{background:var(--key);color:#fff;border-color:var(--key)}
.pl{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;gap:8px;align-items:center;font-size:15px}
.pl.done{opacity:.5}.pl b{font-variant-numeric:tabular-nums;min-width:72px}.pl span{flex:1}
.duebar{background:var(--sel);color:var(--ink);border:2px solid var(--ball);border-radius:10px;padding:8px 10px;margin-top:8px;display:flex;gap:8px;align-items:center;font-size:14px}
.duebar span{flex:1}
.nextbar{margin-top:8px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.nx{display:flex;gap:8px}
.nextbar b{display:inline-block;min-width:64px;font-variant-numeric:tabular-nums;color:var(--key)}
@keyframes fl{50%{background:var(--ball)}}
@media (prefers-reduced-motion:no-preference){.duebar{animation:fl 1s 4}}
details{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
summary{cursor:pointer;font-weight:600;min-height:28px}
.frm{display:flex;gap:8px;margin:10px 0}
select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink)}
.lbl{font-size:14px;color:var(--mute);margin:8px 0 6px}
.pltxt{display:flex;gap:8px;align-items:flex-start;flex:1;text-align:left;background:none;color:var(--ink);padding:4px 0;min-height:36px;font-size:15px}
.pltxt b{display:inline-block;min-width:78px}
.pj{position:relative;background:var(--card);border:2px solid var(--line);border-radius:8px;margin-bottom:4px;overflow:hidden;display:flex;justify-content:space-between;padding:6px 10px;font-size:14px}
.pj i{position:absolute;left:0;top:0;bottom:0;background:var(--sel)}
.pj span,.pj b{position:relative}
.hurt{font-size:13px}
.hurt.on{background:var(--ball);color:#fff}
.sm{display:grid;grid-template-columns:1fr 54px 54px 62px;gap:4px;padding:6px 8px;background:var(--card);border:2px solid var(--line);border-radius:8px;margin-bottom:4px;font-size:14px;font-variant-numeric:tabular-nums}
.sm.hd{background:none;border:0;color:var(--mute);font-size:13px}
.sm span:nth-child(n+2){text-align:right}
textarea{font:13px/1.3 ui-monospace,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink);width:100%}
.empty{color:var(--mute);padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="clock">
    <div><div class="q" id="q">Q1</div><div class="time" id="time">10:00</div></div>
    <div class="btns"><button class="go" id="run">Start</button><button class="ghost" id="reset">Reset</button></div>
  </div>
  <div id="due"></div><div id="back"></div><div id="next"></div></div>
  <div id="sumsec" hidden><h2>Game summary</h2><div id="sum"></div></div>

  <h2>On court <span id="cc"></span></h2>
  <div id="court"></div>
  <p class="hint" id="hint"></p>

  <h2>Bench</h2>
  <div id="bench"></div>
  <div class="add">
    <input id="nn" inputmode="numeric" placeholder="#" maxlength="3" aria-label="Jersey number">
    <input id="na" placeholder="Player name" aria-label="Player name">
    <button id="addb">Add player</button>
  </div>

  <h2>Starting lineup <span id="sc"></span></h2>
  <div id="starters"></div>
  <div class="frm"><button class="go" data-act="pstart" id="pstart">Put starters on court</button><span class="hint" id="smsg" style="align-self:center"></span></div>

  <h2>Sub plan <span id="pc"></span></h2>
  <select id="plsel" style="width:100%" aria-label="Choose plan"></select>
  <div class="add"><input id="plname" aria-label="Plan name" style="flex:1"><button data-act="plnew">New</button><button data-act="plcopy">Copy</button><button id="pldel">Delete</button></div>
  <p class="hint">Tap a planned sub to edit it.</p>
  <div id="plan"></div>
  <details open id="pjdet"><summary>Projected game time</summary><div id="pjbody" style="margin-top:8px"></div></details>
  <details id="pdet">
    <summary>Add planned sub</summary>
    <div class="frm"><select id="pq" aria-label="Quarter"><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select><input id="pt" value="5:00" aria-label="Time left"><button class="go" data-act="padd" id="padd">Add to plan</button><button class="clr" data-act="pcancel" id="pcancel" hidden>Cancel</button></div>
    <div class="lbl">Coming out</div><div id="fo"></div>
    <div class="lbl">Going in</div><div id="fi"></div>
    <span class="hint" id="pmsg" style="display:block;margin-top:8px"></span>
  </details>
  <div class="add"><button class="clr" id="pclear" style="width:100%">Clear plan</button></div>
  <details id="bkdet"><summary>Backup and restore</summary>
    <p class="hint">Copy your roster, starting lineup and all plans as text and keep it in Notes. Paste it back here to restore.</p>
    <textarea id="bk" rows="5" aria-label="Backup text"></textarea>
    <div class="frm" style="flex-wrap:wrap"><button class="go" id="bkcopy">Copy backup</button><button class="clr" id="bkrest">Restore from text</button><button class="clr" id="bkseed">Load built-in plan</button></div>
    <p class="hint" id="bkmsg"></p>
  </details>

  <h2>Substitutions <span id="lc"></span></h2>
  <ul class="log" id="log"></ul>
</div>
<div class="bar" id="bar" hidden><div><span id="bmsg"></span><button class="clr" data-act="clr">Clear</button><button class="go" data-act="sub" id="bsub">Confirm sub</button></div></div>

<script>
var KEY='subtracker-v1';
var QL=600000;
var SEED={"v":1,"players":[],"starters":[],"plans":[{"id":"plan-default","name":"Plan A","items":[]}],"pid":"plan-default"};
var S={players:[],running:false,q:1,rem:QL,log:[],sel:[]};
try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);S.running=false;S.sel=[];}}catch(e){}
if(typeof S.rem!=='number'){S.rem=QL;S.q=1;S.log=[];S.players.forEach(function(p){p.ms=0;p.on=false;});}
if(!S.plan)S.plan=[];
if(!S.starters)S.starters=[];
if(!S.plans||!S.plans.length){S.plans=[{id:'a',name:'Plan A',items:S.plan||[]}];S.pid='a';}
var ap=S.plans.filter(function(x){return x.id===S.pid;})[0]||S.plans[0];S.pid=ap.id;S.plan=ap.items;
var F={out:[],inn:[]};var E=null;
if(!S.players.length)applyBackup(SEED);
var last=Date.now();

function save(){try{var a=S.plans&&S.plans.filter(function(x){return x.id===S.pid;})[0];if(a)a.items=S.plan;localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function find(id){return S.players.filter(function(p){return p.id===id;})[0];}
function label(p){return (p.num?'#'+p.num+' ':'')+p.name;}
function wrap(p,rm){
  return '<div style="display:flex;gap:4px;align-items:center">'+row(p).replace('class="p','style="flex:1" class="p')+'<button class="rm hurt'+(p.inj?' on':'')+'" data-hurt="'+p.id+'" aria-label="Toggle injured state">'+(p.inj?'⚠':'')+'</button></div>';
}
function row(p){
  return '<button class="p'+(S.sel.indexOf(p.id)>-1?' sel':'')+'" data-id="'+p.id+'"><span class="num">'+esc(p.num||'–')+'</span><span class="nm">'+esc(p.name)+(p.inj?' (injured)':'')+'</span><span class="min" data-min="'+p.id+'">'+fmt(p.ms||0)+'</span></button>';
}

function render(){
  var on=S.players.filter(function(p){return p.on;});
  var off=S.players.filter(function(p){return !p.on;});
  document.getElementById('court').innerHTML=on.length?on.map(function(p){return wrap(p,false);}).join(''):'<div class="empty">Add players, then tap them from the bench to put them on court.</div>';
  document.getElementById('bench').innerHTML=off.length?off.map(function(p){return wrap(p,true);}).join(''):'<div class="empty">Bench is empty.</div>';
  document.getElementById('cc').textContent=on.length+'/5';
  var sp=S.sel.map(find).filter(Boolean),so=sp.filter(function(x){return x.on;}),si=sp.filter(function(x){return !x.on;});
  var okSub=si.length>0&&on.length-so.length+si.length<=5;
  var h='';
  if(!sp.length)h=on.length<5&&off.length?'Select bench players to put on court, then confirm.':'Select any court and bench players, then confirm the sub.';
  document.getElementById('hint').innerHTML=h;
  var bar=document.getElementById('bar');bar.hidden=!sp.length;
  var bm=!si.length?'Select bench players to come in.':on.length-so.length+si.length>5?'That would put '+(on.length-so.length+si.length)+' on court. Select more to come out.':(so.length?'Out: '+so.map(label).join(', ')+'. In: '+si.map(label).join(', '):'In: '+si.map(label).join(', '));
  document.getElementById('bmsg').textContent=bm;
  document.getElementById('bsub').disabled=!okSub;
  renderPlan();renderStarters();renderSummary();renderBack();
  document.getElementById('lc').textContent=S.log.length?S.log.length+' total':'';
  document.getElementById('log').innerHTML=S.log.length?S.log.slice().reverse().map(function(l){
    return '<li><b>Q'+l.q+' '+fmt(l.t)+'</b><span>'+(l.out?'<span class="out">Out</span> '+esc(l.out)+'  ':'')+'<span class="in">In</span> '+esc(l.inn)+'</span></li>';
  }).join(''):'<li class="empty">No substitutions yet.</li>';
  var rb=document.getElementById('run'),over=S.rem<=0&&S.q>=4;
  rb.textContent=S.rem<=0?(over?'Game over':'Start Q'+(S.q+1)):S.running?'Pause':'Start';
  rb.disabled=over;
  document.getElementById('q').textContent=over?'Final':'Q'+S.q+(S.rem<=0?' ended':'');
  document.getElementById('time').textContent=fmt(S.rem);
}

function tap(id){
  var k=S.sel.indexOf(id);
  if(k>-1)S.sel.splice(k,1);else S.sel.push(id);
  render();
}
function doSub(){
  var sp=S.sel.map(find).filter(Boolean),so=sp.filter(function(x){return x.on;}),si=sp.filter(function(x){return !x.on;});
  if(!si.length||S.players.filter(function(x){return x.on;}).length-so.length+si.length>5)return;
  so.forEach(function(x){x.on=false;});si.forEach(function(x){x.on=true;});
  S.log.push({q:S.q,t:S.rem,out:so.map(label).join(', '),inn:si.map(label).join(', ')});
  S.sel=[];save();render();
}

function renderStarters(){
  document.getElementById('sc').textContent=S.starters.length+'/5';
  document.getElementById('starters').innerHTML=S.players.length?S.players.map(function(p){
    return '<button class="chip'+(S.starters.indexOf(p.id)>-1?' on':'')+'" data-chip="start" data-cid="'+p.id+'">'+esc(label(p))+'</button>';
  }).join(''):'<div class="empty">Add players first.</div>';
  var started=S.rem<QL||S.q>1;
  document.getElementById('pstart').disabled=started||!S.starters.length;
  document.getElementById('smsg').textContent=started?'Game in progress. Reset to apply a new lineup.':'';
}
function applyStarters(){
  S.players.forEach(function(p){p.on=false;});
  var si=S.starters.map(find).filter(function(p){return p&&!p.inj;}).slice(0,5);
  si.forEach(function(p){p.on=true;});
  S.log=S.log.filter(function(x){return !(x.q===1&&x.t===QL);});
  if(si.length)S.log.push({q:1,t:QL,out:'',inn:si.map(label).join(', ')});
  S.sel=[];
}
var shownDue='',ac=null,lastNext='';
function renderNext(){
  var up=S.plan.filter(function(x){return !x.done&&!passed(x)&&live(x);}).slice(0,1);
  var h=up.length?'<div class="nextbar">'+up.map(function(x){
    return '<div class="nx"><b>'+(x.q===S.q?'in '+fmt(S.rem-x.t):'Q'+x.q+' '+fmt(x.t))+'</b><div><span class="out">Out</span> '+esc(lab(eff(x).o))+'<br><span class="in">In</span> '+esc(lab(eff(x).i))+'</div></div>';
  }).join('')+'</div>':'';
  if(h!==lastNext){lastNext=h;document.getElementById('next').innerHTML=h;}
}
function ping(){
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
  try{if(ac){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.4);}}catch(e){}
}
function renderSummary(){
  var over=S.rem<=0&&S.q>=4,box=document.getElementById('sumsec');
  box.hidden=!over;if(!over)return;
  var plan=S.snap||simulate().tot;
  var ps=S.players.filter(function(p){return p.ms>0||(plan[p.id]||0)>0;}).sort(function(a,b){return b.ms-a.ms;});
  document.getElementById('sum').innerHTML='<div class="sm hd"><span>Player</span><span>Plan</span><span>Actual</span><span>Diff</span></div>'+ps.map(function(p){
    var pl=plan[p.id]||0,d=p.ms-pl,sg=d>=1000?'+':d<=-1000?'−':'';
    return '<div class="sm"><span>'+esc(label(p))+'</span><span>'+fmt(pl)+'</span><span>'+fmt(p.ms)+'</span><span class="'+(sg==='+'?'in':sg?'out':'')+'">'+(sg?sg+fmt(Math.abs(d)):'0:00')+'</span></div>';
  }).join('')+'<p class="hint">Plan is the minutes your sub plan gave each player when the game started.</p>';
}
function plannedOn(){
  var on={},st=S.starters.length?S.starters:S.players.filter(function(p){return p.on;}).map(function(p){return p.id;});
  st.slice(0,5).forEach(function(id){if(find(id))on[id]=1;});
  S.plan.slice().sort(function(a,b){return a.q-b.q||b.t-a.t;}).forEach(function(x){
    if(!passed(x))return;
    x.out.forEach(function(id){delete on[id];});
    x.inn.forEach(function(id){if(Object.keys(on).length<5&&find(id))on[id]=1;});
  });
  return on;
}
var lastBack='';
function renderBack(){
  var ex=plannedOn(),h='';
  S.players.forEach(function(p){
    if(!p.back||p.inj)return;
    if(p.on){p.back=false;return;}
    if(!ex[p.id])return;
    var offs=S.players.filter(function(q){return q.on&&!ex[q.id];});
    h+='<div class="duebar"><span><b>Back</b><br>'+esc(label(p))+' should be on court now.'+(offs.length?'<br>Plan has '+esc(lab(offs))+' off.':'')+'</span><button class="go" data-act="pback" data-pid="'+p.id+'">Back</button></div>';
  });
  if(h!==lastBack){lastBack=h;document.getElementById('back').innerHTML=h;}
}
function names(ids,w){return ids.map(find).filter(Boolean).map(function(p){return label(p)+(w&&p.inj?' ⚠ injured':'');}).join(', ')||'–';}
function passed(x){return S.q>x.q||(S.q===x.q&&S.rem<=x.t);}
function eff(x){var on=projected(x.q,x.t);return {o:x.out.map(find).filter(function(p){return p&&on[p.id];}),i:x.inn.map(find).filter(function(p){return p&&!on[p.id]&&!p.inj;})};}
function live(x){var e=eff(x);return e.o.length>0||e.i.length>0;}
function lab(ps){return ps.map(label).join(', ')||'–';}
function isDue(x){return !x.done&&passed(x)&&live(x);}
function parseT(v){var m=/^(\d{1,2})(?::(\d{2}))?$/.exec(String(v).trim());return m?((+m[1])*60+(+m[2]||0))*1000:null;}
function projected(q,t){
  var on={},fresh=S.q===1&&S.rem>=QL&&S.starters.length;
  S.players.forEach(function(p){if(fresh?S.starters.indexOf(p.id)>-1:p.on)on[p.id]=1;});
  S.plan.filter(function(x){return x.id!==E&&!x.done&&(x.q<q||(x.q===q&&x.t>t));}).forEach(function(x){
    x.out.forEach(function(id){delete on[id];});
    x.inn.forEach(function(id){var f=find(id);if(f&&!f.inj)on[id]=1;});
  });
  return on;
}
function renderPlan(){
  var pl=S.plan;renderPlanBar();renderProj();
  document.getElementById('pc').textContent=pl.length?pl.filter(function(x){return x.done;}).length+'/'+pl.length+' done':'';
  document.getElementById('plan').innerHTML=pl.length?pl.map(function(x){
    return '<div class="pl'+(x.done||(passed(x)&&!live(x))?' done':'')+'"><button class="pltxt" data-act="pedit" data-pid="'+x.id+'"><b>Q'+x.q+' '+fmt(x.t)+'</b><span><span class="out">Out</span> '+esc(lab(x.out.map(find).filter(Boolean)))+'<br><span class="in">In</span> '+esc(lab(x.inn.map(find).filter(Boolean)))+'</span></button></div>';
  }).join(''):'<div class="empty">No planned subs. Add the ones you want for this game.</div>';
  var d=pl.filter(isDue)[0];shownDue=d?d.id:'';renderNext();
  document.getElementById('due').innerHTML=d?'<div class="duebar"><span><b>Due now</b><br><span class="out">Out</span> '+esc(lab(eff(d).o))+'<br><span class="in">In</span> '+esc(lab(eff(d).i))+'</span><button class="go" data-act="papply" data-pid="'+d.id+'">Apply</button><button class="clr" data-act="pskip" data-pid="'+d.id+'">Skip</button></div>':'';
  var pt=parseT(document.getElementById('pt').value);
  var onSet=projected(+document.getElementById('pq').value,pt===null?0:pt);
  F.out=F.out.filter(function(id){return onSet[id];});
  F.inn=F.inn.filter(function(id){return !onSet[id]&&!(find(id)&&find(id).inj);});
  ['out','inn'].forEach(function(k){
    var list=S.players.filter(function(p){return k==='out'?onSet[p.id]:!onSet[p.id]&&!p.inj;});
    document.getElementById(k==='out'?'fo':'fi').innerHTML=list.length?list.map(function(p){
      return '<button class="chip'+(F[k].indexOf(p.id)>-1?' on':'')+'" data-chip="'+k+'" data-cid="'+p.id+'">'+esc(label(p))+'</button>';
    }).join(''):'<div class="empty">'+(!S.players.length?'Add players first.':k==='out'?'No one is on court at that time.':'No one available to come in.')+'</div>';
  });
}
function applyPlan(id,skip){
  var it=S.plan.filter(function(x){return x.id===id;})[0];if(!it)return;
  if(!skip){
    var so=it.out.map(find).filter(function(p){return p&&p.on;}),si=it.inn.map(find).filter(function(p){return p&&!p.on&&!p.inj;});
    so.forEach(function(p){p.on=false;});
    var room=5-S.players.filter(function(p){return p.on;}).length;
    si=si.slice(0,Math.max(room,0));
    si.forEach(function(p){p.on=true;});
    if(so.length||si.length)S.log.push({q:S.q,t:S.rem,out:so.map(label).join(', '),inn:si.map(label).join(', ')});
  }
  it.done=true;S.sel=[];save();render();
}
function addPlan(){
  var msg=document.getElementById('pmsg'),m=/^(\d{1,2})(?::(\d{2}))?$/.exec(document.getElementById('pt').value.trim());
  var t=m?((+m[1])*60+(+m[2]||0))*1000:null;
  if(m&&m[2]&&+m[2]>59)t=null;
  if(t===null||t>QL){msg.textContent='Enter time left like 5:00 (max 10:00).';return;}
  if(!F.out.length&&!F.inn.length){msg.textContent='Choose who comes out or goes in.';return;}
  var q=+document.getElementById('pq').value,was=!!E;
  if(E){var it=S.plan.filter(function(x){return x.id===E;})[0];if(it){it.q=q;it.t=t;it.out=F.out.slice();it.inn=F.inn.slice();it.done=false;}}
  else S.plan.push({id:'s'+Date.now(),q:q,t:t,out:F.out.slice(),inn:F.inn.slice(),done:false});
  S.plan.sort(function(a,b){return a.q-b.q||b.t-a.t;});
  F={out:[],inn:[]};E=null;msg.textContent=was?'Saved.':'Added.';save();render();
}
var ptEl=document.getElementById('pt');
ptEl.addEventListener('input',function(){
  var d=ptEl.value.replace(/\D/g,'').slice(-4);
  if(!d){ptEl.value='';return;}
  d=d.padStart(3,'0');
  ptEl.value=(+d.slice(0,-2))+':'+d.slice(-2);
});
ptEl.addEventListener('focus',function(){ptEl.value='';});
ptEl.addEventListener('blur',function(){if(!ptEl.value)ptEl.value='5:00';});
['input','blur'].forEach(function(ev){ptEl.addEventListener(ev,renderPlan);});
document.getElementById('pq').addEventListener('change',renderPlan);
function curPlan(){return S.plans.filter(function(x){return x.id===S.pid;})[0];}
function switchPlan(pl){save();S.pid=pl.id;S.plan=pl.items;E=null;F={out:[],inn:[]};document.getElementById('pmsg').textContent='';save();render();}
function newPlan(copy){
  save();
  var items=copy?JSON.parse(JSON.stringify(S.plan)).map(function(x,i){x.id='s'+Date.now()+i;x.done=false;return x;}):[];
  var pl={id:'pl'+Date.now(),name:copy?'Copy of '+(curPlan().name||'plan'):'Plan '+(S.plans.length+1),items:items};
  S.plans.push(pl);switchPlan(pl);
}
function editPlan(id){
  var it=S.plan.filter(function(x){return x.id===id;})[0];if(!it)return;
  E=id;F={out:it.out.slice(),inn:it.inn.slice()};
  document.getElementById('pq').value=it.q;
  document.getElementById('pt').value=fmt(it.t).replace(/^0/,'');
  var d=document.getElementById('pdet');d.open=true;
  document.getElementById('pmsg').textContent='Editing Q'+it.q+' '+fmt(it.t);
  render();d.scrollIntoView({behavior:'smooth',block:'center'});
}
function renderPlanBar(){
  document.getElementById('plsel').innerHTML=S.plans.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.pid?' selected':'')+'>'+esc(x.name||'Untitled')+'</option>';}).join('');
  var nm=document.getElementById('plname');if(document.activeElement!==nm)nm.value=curPlan().name;
  document.getElementById('pldel').disabled=S.plans.length<2;
  document.getElementById('padd').textContent=E?'Save changes':'Add to plan';
  document.getElementById('pcancel').hidden=!E;
}
function simulate(){
  var on={},tot={};S.players.forEach(function(p){tot[p.id]=0;});
  var st=S.starters.length?S.starters:S.players.filter(function(p){return p.on;}).map(function(p){return p.id;});
  st.slice(0,5).forEach(function(id){if(find(id)&&!find(id).inj)on[id]=1;});
  var pos=0,short=false;
  function adv(to){var d=to-pos;if(d>0){var ids=Object.keys(on);ids.forEach(function(id){tot[id]+=d;});if(ids.length<5)short=true;pos=to;}}
  S.plan.slice().sort(function(a,b){return a.q-b.q||b.t-a.t;}).forEach(function(x){
    adv((x.q-1)*QL+(QL-x.t));
    x.out.forEach(function(id){delete on[id];});
    x.inn.forEach(function(id){if(Object.keys(on).length<5&&find(id)&&!find(id).inj)on[id]=1;});
  });
  adv(4*QL);
  return {tot:tot,short:short};
}
function renderProj(){
  var r=simulate(),mx=4*QL,ps=S.players.slice().sort(function(a,b){return r.tot[b.id]-r.tot[a.id];});
  document.getElementById('pjbody').innerHTML=S.players.length?(r.short?'<p class="hint">Fewer than 5 on court for part of the game. Set your starting lineup or fill the gaps in the plan.</p>':'')+ps.map(function(p){
    return '<div class="pj"><i style="width:'+Math.round(r.tot[p.id]/mx*100)+'%"></i><span>'+esc(label(p)+(p.inj?' (injured)':''))+'</span><b>'+fmt(r.tot[p.id])+'</b></div>';
  }).join('')+'<p class="hint">Based on your starting lineup and this plan, over 4 × 10 min.</p>':'<div class="empty">Add players first.</div>';
}
document.getElementById('plsel').addEventListener('change',function(e){var pl=S.plans.filter(function(x){return x.id===e.target.value;})[0];if(pl)switchPlan(pl);});
document.getElementById('plname').addEventListener('input',function(e){curPlan().name=e.target.value;save();renderPlanBar();});
(function(){var b=document.getElementById('pldel'),on=false,t;
  function rs(){on=false;b.textContent='Delete';b.style.background='';b.style.color='';}
  b.onclick=function(){
    if(S.plans.length<2)return;
    if(!on){on=true;b.textContent='Tap again';b.style.background='var(--ball)';b.style.color='#fff';t=setTimeout(rs,3000);return;}
    clearTimeout(t);rs();
    S.plans=S.plans.filter(function(x){return x.id!==S.pid;});switchPlan(S.plans[0]);
  };
})();
document.getElementById('bkcopy').onclick=function(){
  save();
  var ta=document.getElementById('bk'),m=document.getElementById('bkmsg'),ok=false;
  ta.value=JSON.stringify({v:1,players:S.players.map(function(p){return {id:p.id,name:p.name,num:p.num};}),starters:S.starters,pid:S.pid,plans:S.plans});
  ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
  try{ok=document.execCommand('copy');}catch(e){}
  if(!ok){try{navigator.clipboard.writeText(ta.value);}catch(e){}}
  m.textContent=ok?'Copied. Paste it into Notes to keep it safe.':'Tap and hold the text, then choose Copy.';
};
(function(){
  var b=document.getElementById('bkrest'),on=false,t;
  function rs(){on=false;b.textContent='Restore from text';b.style.background='';b.style.color='';}
  b.onclick=function(){
    var m=document.getElementById('bkmsg'),d=null;
    try{d=JSON.parse(document.getElementById('bk').value.trim());}catch(e){}
    if(!d||!Array.isArray(d.players)||!Array.isArray(d.plans)||!d.plans.length){m.textContent='Paste a backup into the box first.';return;}
    if(!on){on=true;b.textContent='Tap again to replace everything';b.style.background='var(--ball)';b.style.color='#fff';t=setTimeout(rs,3000);return;}
    clearTimeout(t);rs();
    applyBackup(d);render();m.textContent='Restored. Roster, lineup and plans are back.';
  };
})();
function applyBackup(d){
    S.players=d.players.map(function(p){return {id:String(p.id),name:String(p.name||''),num:String(p.num||''),on:false,ms:0};});
    S.starters=(d.starters||[]).map(String);
    S.plans=(d.plans||[]).map(function(pl){return {id:String(pl.id),name:String(pl.name||'Plan'),items:(pl.items||[]).map(function(x){return {id:String(x.id),q:+x.q||1,t:+x.t||0,out:(x.out||[]).map(String),inn:(x.inn||[]).map(String),done:Boolean(x.done)};})};});
    var a=S.plans.filter(function(x){return x.id===String(d.pid);})[0]||S.plans[0];
    S.pid = a ? a.id : (S.plans[0] ? S.plans[0].id : 'plan-default');
    S.plan=a ? a.items : [];
    S.rem=QL;S.q=1;S.running=false;S.log=[];S.sel=[];S.snap=null;E=null;F={out:[],inn:[]};
    save();
}
(function(){
  var b=document.getElementById('bkseed'),on=false,t;
  function rs(){on=false;b.textContent='Load built-in plan';b.style.background='';b.style.color='';}
  b.onclick=function(){
    var m=document.getElementById('bkmsg');
    if(!on){on=true;b.textContent='Tap again to replace everything';b.style.background='var(--ball)';b.style.color='#fff';m.textContent='This replaces your roster, lineup and plans with the built-in game plan.';t=setTimeout(rs,3000);return;}
    clearTimeout(t);rs();applyBackup(SEED);render();m.textContent='Built-in plan loaded.';
  };
})();
var clrArmed=false,clrT=null;
document.getElementById('pclear').onclick=function(){
  var b=document.getElementById('pclear');
  if(!clrArmed){clrArmed=true;b.textContent='Tap again to clear plan';b.style.background='var(--ball)';b.style.color='#fff';clrT=setTimeout(function(){clrArmed=false;b.textContent='Clear plan';b.style.background='';b.style.color='';},3000);return;}
  clearTimeout(clrT);clrArmed=false;b.textContent='Clear plan';b.style.background='';b.style.color='';
  S.plan=[];save();render();
};

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='sub'){doSub();}
  else if(b.dataset.act==='papply'){applyPlan(b.dataset.pid,false);}
  else if(b.dataset.act==='pskip'){applyPlan(b.dataset.pid,true);}
  else if(b.dataset.act==='pdel'){if(E===b.dataset.pid){E=null;F={out:[],inn:[]};}S.plan=S.plan.filter(function(x){return x.id!==b.dataset.pid;});save();render();}
  else if(b.dataset.act==='pback'){
    var bp=find(b.dataset.pid);
    if(bp){var ex0=plannedOn(),o0=S.players.filter(function(q){return q.on&&!ex0[q.id];})[0];S.sel=[bp.id].concat(o0?[o0.id]:[]);render();}
  }
  else if(b.dataset.act==='pedit'){editPlan(b.dataset.pid);}
  else if(b.dataset.act==='pcancel'){E=null;F={out:[],inn:[]};document.getElementById('pmsg').textContent='';render();}
  else if(b.dataset.act==='plnew'){newPlan(false);}
  else if(b.dataset.act==='plcopy'){newPlan(true);}
  else if(b.dataset.act==='padd'){addPlan();}
  else if(b.dataset.chip==='start'){
    var sid=b.dataset.cid,si=S.starters.indexOf(sid);
    if(si>-1)S.starters.splice(si,1);else if(S.starters.length<5)S.starters.push(sid);
    save();render();
  }
  else if(b.dataset.act==='pstart'){applyStarters();save();render();}
  else if(b.dataset.chip){
    var k=b.dataset.chip,o=k==='out'?'inn':'out',id=b.dataset.cid,i=F[k].indexOf(id);
    if(i>-1)F[k].splice(i,1);else{F[k].push(id);F[o]=F[o].filter(function(x){return x!==id;});}
    render();
  }
  else if(b.dataset.act==='clr'){S.sel=[];render();}
  else if(b.dataset.hurt){var hp=find(b.dataset.hurt);if(hp){hp.inj=!hp.inj;hp.back=!hp.inj;save();render();}}
  else if(b.dataset.rm){S.players=S.players.filter(function(p){return p.id!==b.dataset.rm;});var rid=b.dataset.rm;S.sel=S.sel.filter(function(x){return x!==rid;});F.out=F.out.filter(function(x){return x!==rid;});F.inn=F.inn.filter(function(x){return x!==rid;});save();render();}
  else if(b.dataset.id){tap(b.dataset.id);}
});
document.getElementById('run').onclick=function(){
  try{if(!ac){var AC=window.AudioContext||window.webkitAudioContext;ac=new AC();}if(ac.state==='suspended')ac.resume();}catch(e){}
  if(!S.snap&&!S.running&&S.q===1&&S.rem>=QL){var st0=simulate().tot;S.snap={};Object.keys(st0).forEach(function(k){S.snap[k]=st0[k];});}
  if(S.rem<=0){if(S.q<4){S.q++;S.rem=QL;}}
  else S.running=!S.running;
  last=Date.now();save();render();
};
var armed=false,armT=null;
document.getElementById('reset').onclick=function(){
  var btn=document.getElementById('reset');
  if(!armed){
    armed=true;btn.textContent='Tap again to reset';btn.style.background='var(--ball)';
    armT=setTimeout(function(){armed=false;btn.textContent='Reset';btn.style.background='';},3000);
    return;
  }
  clearTimeout(armT);armed=false;btn.textContent='Reset';btn.style.background='';
  S.rem=QL;S.q=1;S.running=false;S.log=[];S.sel=[];S.snap=null;
  S.players.forEach(function(p){p.ms=0;p.on=false;});
  S.plan.forEach(function(x){x.done=false;});
  applyStarters();
  save();render();
};
function addPlayer(){
  var n=document.getElementById('na'),u=document.getElementById('nn');
  var name=n.value.trim();if(!name){n.focus();return;}
  S.players.push({id:'p'+Date.now(),name:name,num:u.value.trim(),on:false,ms:0});
  n.value='';u.value='';save();render();n.focus();
}
document.getElementById('addb').onclick=addPlayer;
document.getElementById('na').addEventListener('keydown',function(e){if(e.key==='Enter')addPlayer();});

var saveTick=0;
setInterval(function(){
  var now=Date.now(),dt=now-last;last=now;
  if(!S.running)return;
  dt=Math.min(dt,S.rem);
  S.rem-=dt;
  S.players.forEach(function(p){if(p.on)p.ms+=dt;});
  if(S.rem<=0){S.running=false;save();render();return;}
  var dd=S.plan.filter(isDue)[0],did=dd?dd.id:'';
  if(did!==shownDue){renderPlan();if(did)ping();}
  renderNext();renderBack();
  document.getElementById('time').textContent=fmt(S.rem);
  S.players.forEach(function(p){var el=document.querySelector('[data-min="'+p.id+'"]');if(el)el.textContent=fmt(p.ms);});
  if(++saveTick%20===0)save();
},250);

render();
</script>
